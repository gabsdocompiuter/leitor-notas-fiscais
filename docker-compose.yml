name: leitor-notas-fiscais

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    volumes:
      - ./backend/data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/health', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8080').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

  nginx:
    build:
      context: ./nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: 8008
      FRONTEND_HOST: frontend
      FRONTEND_PORT: 8080
    ports:
      - "${APP_PORT:-8080}:80"
