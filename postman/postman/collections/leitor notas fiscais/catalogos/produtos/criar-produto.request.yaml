$kind: http-request
name: Criar produto
url: "{{baseUrl}}/produtos"
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "nome": "Leite integral",
      "categoria_id": "{{categoriaId}}",
      "nao_solicitar_marca": false,
      "tratar_apenas_como_unidades": false,
      "contem_variacoes": true,
      "unidade_medida": "G"
    }
order: 2000
