$kind: http-request
name: Criar produto
url: "{{baseUrl}}/produtos"
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "nome": "Leite integral",
      "categoria_id": "{{categoriaId}}",
      "unidade_base": "L",
      "nao_solicitar_marca": false
    }
order: 2000
