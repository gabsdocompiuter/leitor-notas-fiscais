$kind: http-request
name: Alterar produto
url: "{{baseUrl}}/produtos/:produtoId"
method: PATCH
pathVariables:
  - key: produtoId
    value: "{{produtoId}}"
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "nome": "Leite integral",
      "categoria_id": "{{categoriaId}}",
      "nao_solicitar_marca": false,
      "tratar_apenas_como_unidades": false,
      "contem_variacoes": true,
      "unidade_medida": "G"
    }
order: 4000
