$kind: http-request
name: Alterar produto
url: "{{baseUrl}}/produtos/:produtoId"
method: PATCH
pathVariables:
  - key: produtoId
    value: "{{produtoId}}"
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "nome": "Leite integral",
      "categoria_id": "{{categoriaId}}",
      "unidade_base": "L"
    }
order: 4000
