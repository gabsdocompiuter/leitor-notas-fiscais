$kind: http-request
name: Revisar item
description: "Confirma produto e quantidade; marca e variação são exigidas conforme a configuração do produto."
url: "{{baseUrl}}/notas/:chave/itens/:itemId"
method: PATCH
pathVariables:
  - key: chave
    value: "{{chaveNfce}}"
  - key: itemId
    value: "{{itemId}}"
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "produto_id": "{{produtoId}}",
      "marca_id": "{{marcaId}}",
      "variacao_id": "{{variacaoId}}",
      "quantidade_confirmada": "1"
    }
order: 3000
