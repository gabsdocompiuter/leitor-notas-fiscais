$kind: http-request
name: Revisar item
description: "Confirma produto, unidade e quantidade normalizada; a marca é obrigatória conforme a configuração do produto."
url: "{{baseUrl}}/notas/:chave/itens/:itemId"
method: PATCH
pathVariables:
  - key: chave
    value: "{{chaveNfce}}"
  - key: itemId
    value: "{{itemId}}"
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "produto_id": "{{produtoId}}",
      "marca_id": "{{marcaId}}",
      "unidade_corrigida": "UN",
      "quantidade_normalizada": "1"
    }
order: 3000
