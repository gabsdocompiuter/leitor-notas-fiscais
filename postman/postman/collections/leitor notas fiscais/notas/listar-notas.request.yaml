$kind: http-request
name: Listar notas
description: Lista as notas salvas. Ative os parâmetros desejados para filtrar ou paginar.
url: "{{baseUrl}}/notas"
method: GET
queryParams:
  - key: situacao
    value: lida
    description: "Valores aceitos: lida, em_revisao ou importada."
    disabled: true
  - key: limite
    value: "50"
    description: Quantidade entre 1 e 100.
    disabled: true
  - key: deslocamento
    value: "0"
    description: Quantidade de registros ignorados no início da listagem.
    disabled: true
order: 1000
