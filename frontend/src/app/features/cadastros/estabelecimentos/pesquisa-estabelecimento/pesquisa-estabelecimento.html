<div
  class="modal fade show d-block"
  tabindex="-1"
  role="dialog"
  aria-modal="true"
  aria-labelledby="titulo-pesquisa-estabelecimento"
  (mousedown)="solicitarFechamento()"
  (keydown.escape)="cadastroAberto() ? voltarParaPesquisa() : solicitarFechamento()"
>
  <div
    class="modal-dialog modal-dialog-centered modal-dialog-scrollable"
    (mousedown)="$event.stopPropagation()"
  >
    <section class="modal-content">
      <header class="modal-header lnf-modal-header align-items-start gap-3">
        <h2 class="modal-title fs-5 flex-fill" id="titulo-pesquisa-estabelecimento">
          {{ cadastroAberto() ? tituloCadastro : tituloPesquisa }}
        </h2>
        <button
          type="button"
          class="btn-close flex-shrink-0 m-0"
          aria-label="Fechar"
          [disabled]="salvando()"
          (click)="solicitarFechamento()"
        ></button>
      </header>
      @if (!cadastroAberto()) {
        <div class="modal-body">
          <div class="input-group input-group-lg mb-3">
            <span class="input-group-text"><i class="bi bi-search" aria-hidden="true"></i></span>
            <input
              #campoBusca
              type="search"
              class="form-control"
              [value]="busca()"
              (input)="atualizarBusca($event)"
              [placeholder]="placeholderPesquisa"
              aria-label="Pesquisar estabelecimento"
            />
            <button
              type="button"
              class="btn btn-primary"
              aria-label="Criar estabelecimento"
              title="Criar estabelecimento"
              (click)="abrirCadastro()"
            >
              <i class="bi bi-plus-lg" aria-hidden="true"></i>
            </button>
          </div>
          <div class="list-group list-group-flush">
            @for (registro of resultados(); track registro.id) {
              <button
                type="button"
                class="list-group-item list-group-item-action d-flex align-items-center gap-3"
                (click)="selecionar(registro)"
              >
                <i
                  class="bi bi-shop fs-4 text-primary-emphasis flex-shrink-0"
                  aria-hidden="true"
                ></i>
                <span class="lnf-modal-texto flex-fill text-wrap">
                  <strong class="d-block">{{ registro.nome_exibicao }}</strong>
                  @if (registro.cnpj) {
                    <span class="small text-body-secondary">CNPJ {{ registro.cnpj }}</span>
                  }
                </span>
                <i class="bi bi-chevron-right ms-auto flex-shrink-0" aria-hidden="true"></i>
              </button>
            } @empty {
              <p class="text-body-secondary text-center py-4 mb-0">{{ mensagemSemResultados }}</p>
            }
          </div>
        </div>
      } @else {
        <form
          class="lnf-modal-form d-flex flex-column overflow-hidden"
          [formGroup]="formulario"
          (ngSubmit)="criar()"
        >
          <div class="modal-body">
            @if (erro()) {
              <div class="alert alert-danger" role="alert">{{ erro() }}</div>
            }
            <label class="form-label" for="novo-apelido">Apelido</label>
            <input
              id="novo-apelido"
              class="form-control"
              formControlName="apelido"
              maxlength="100"
              [class.is-invalid]="
                formulario.controls.apelido.invalid && formulario.controls.apelido.touched
              "
              [readOnly]="salvando()"
            />
            <div class="invalid-feedback">Informe um apelido com até 100 caracteres.</div>
          </div>
          <footer class="modal-footer flex-shrink-0">
            <button
              type="button"
              class="btn btn-outline-secondary"
              [disabled]="salvando()"
              (click)="voltarParaPesquisa()"
            >
              Cancelar
            </button>
            <button #campoConfirmacao type="submit" class="btn btn-primary" [disabled]="salvando()">
              @if (salvando()) {
                <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span
                >Salvando...
              } @else {
                Criar e selecionar
              }
            </button>
          </footer>
        </form>
      }
    </section>
  </div>
</div>
<div class="modal-backdrop fade show"></div>
