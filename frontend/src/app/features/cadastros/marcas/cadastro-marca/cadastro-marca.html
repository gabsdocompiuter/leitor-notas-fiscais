<div class="container py-4 py-md-5">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-8">
      <a routerLink="/cadastros/marcas" class="link-secondary text-decoration-none">← Marcas</a>

      <h1 class="h2 my-4">{{ novo ? 'Nova marca' : 'Editar marca' }}</h1>

      @if (erro()) {
        <div class="alert alert-danger" role="alert">{{ erro() }}</div>
      }

      @if (carregando()) {
        <div class="d-flex justify-content-center py-5">
          <div class="spinner-border" role="status">
            <span class="visually-hidden">Carregando...</span>
          </div>
        </div>
      } @else {
        <form class="card" #formulario="ngForm" (ngSubmit)="salvar()">
          <div class="card-body">
            <label class="form-label" for="nome-marca">Nome</label>
            <input
              id="nome-marca"
              class="form-control"
              name="nome"
              required
              maxlength="100"
              autofocus
              [(ngModel)]="nome"
            />
          </div>
          <div class="card-footer d-flex flex-wrap justify-content-end gap-2">
            <a class="btn btn-outline-secondary" routerLink="/cadastros/marcas">Cancelar</a>
            <button
              class="btn btn-primary"
              type="submit"
              [disabled]="salvando() || formulario.invalid || !nome.trim()"
            >
              {{ salvando() ? 'Salvando...' : 'Salvar' }}
            </button>
          </div>
        </form>
      }
    </div>
  </div>
</div>
